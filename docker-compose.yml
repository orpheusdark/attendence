services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/secure_attendance
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: replace-with-access-secret
      JWT_REFRESH_SECRET: replace-with-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      QR_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      APP_ORIGIN: http://localhost:5173
      API_BASE_URL: http://localhost:4000
    depends_on:
      - mongo
      - redis
    ports:
      - "4000:4000"

volumes:
  mongo_data: