name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: docker compose up -d --build mongo redis api
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          docker compose logs --no-color api
          exit 1
      - run: docker compose exec -T api node dist/seed/seed.js
      - run: npm run e2e
      - if: always()
        run: docker compose down -v